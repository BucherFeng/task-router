name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install mcp==1.27.0
      - name: Syntax check
        run: |
          python3 -B -m py_compile scripts/model_proxy.py scripts/install.py \
            plugins/task-router/scripts/mcp_server.py \
            plugins/task-router/scripts/task_router_runtime/*.py
      - name: Run tests
        run: python3 -B -m unittest discover -s tests -q
